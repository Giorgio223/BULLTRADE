<!doctype html>

<script>
(function(){
  // Robust in-page debugger. Runs even if other scripts fail.
  const logs = [];
  function fmt(v){
    try{
      if(v instanceof Error) return v.stack || v.message || String(v);
      if(typeof v === "object") return JSON.stringify(v);
      return String(v);
    }catch(e){ return String(v); }
  }
  function add(type, msg){
    const line = "[" + new Date().toLocaleTimeString() + "] " + type + ": " + msg;
    logs.push(line);
    try{
      if(window.__DBG_BOX){
        const body = window.__DBG_BODY;
        const div = document.createElement("div");
        div.style.whiteSpace="pre-wrap";
        div.style.wordBreak="break-word";
        div.textContent = line;
        body.appendChild(div);
        window.__DBG_BOX.style.display="block";
        body.scrollTop = body.scrollHeight;
      }
    }catch(_){}
  }

  // expose
  window.__DBG_LOGS = logs;
  window.__DBG_ADD = add;

  // hook errors
  window.addEventListener("error", function(e){
    const msg = (e && e.message ? e.message : "error") +
      (e && e.filename ? (" @ " + e.filename + ":" + e.lineno + ":" + e.colno) : "");
    add("window.error", msg);
  });

  window.addEventListener("unhandledrejection", function(e){
    const r = e && e.reason;
    add("rejection", (r && (r.stack || r.message)) ? (r.stack || r.message) : fmt(r));
  });

  // hook console
  const orig = {
    log: console.log.bind(console),
    warn: console.warn.bind(console),
    error: console.error.bind(console),
  };
  console.log = (...a)=>{ add("log", a.map(fmt).join(" ")); return orig.log(...a); };
  console.warn = (...a)=>{ add("warn", a.map(fmt).join(" ")); return orig.warn(...a); };
  console.error = (...a)=>{ add("error", a.map(fmt).join(" ")); return orig.error(...a); };

  // Build UI ASAP after DOM ready
  function mount(){
    if(window.__DBG_BOX) return;
    const box = document.createElement("div");
    box.id = "dbgBox";
    box.style.position="fixed";
    box.style.left="8px";
    box.style.right="8px";
    box.style.bottom="8px";
    box.style.maxHeight="45vh";
    box.style.overflow="auto";
    box.style.background="rgba(0,0,0,0.92)";
    box.style.color="#fff";
    box.style.fontFamily="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace";
    box.style.fontSize="12px";
    box.style.padding="10px";
    box.style.borderRadius="12px";
    box.style.zIndex="100000";
    box.style.display="none";

    const hdr = document.createElement("div");
    hdr.style.display="flex";
    hdr.style.gap="8px";
    hdr.style.alignItems="center";
    hdr.style.marginBottom="8px";
    hdr.innerHTML = "<b style='color:#6cf'>DEBUG</b>";

    const btn = (txt)=>{
      const b=document.createElement("button");
      b.textContent=txt;
      b.style.padding="4px 8px";
      b.style.fontSize="12px";
      b.style.cursor="pointer";
      return b;
    };
    const bHide=btn("Hide");
    const bCopy=btn("Copy");
    const bClear=btn("Clear");

    hdr.appendChild(bHide);
    hdr.appendChild(bCopy);
    hdr.appendChild(bClear);

    const body=document.createElement("div");
    body.style.overflow="auto";
    body.style.maxHeight="38vh";

    box.appendChild(hdr);
    box.appendChild(body);
    document.body.appendChild(box);

    window.__DBG_BOX = box;
    window.__DBG_BODY = body;

    // render existing logs
    logs.forEach(l=>add("replay", l.replace(/^\[[^\]]+\]\s*replay:\s*/,"")));

    bHide.onclick=()=>{ box.style.display="none"; };
    bClear.onclick=()=>{ logs.length=0; body.innerHTML=""; box.style.display="none"; };
    bCopy.onclick=async ()=>{
      try{
        await navigator.clipboard.writeText(logs.join("\n"));
        add("info","copied");
      }catch(e){
        add("copy-fail", fmt(e));
      }
    };

    // hotkey Ctrl+`
    window.addEventListener("keydown",(e)=>{
      if(e.ctrlKey && e.key==="`"){
        box.style.display = (box.style.display==="none") ? "block" : "none";
      }
    });
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", mount);
  } else {
    mount();
  }

  add("info", "debugger injected");
})();
</script>

// === TON helpers (global, guaranteed) ===
window.tonToNanoStr = function(ton){
  if(ton === null || ton === undefined) return "0";
  const s = String(ton).replace(",", ".").trim();
  if(!s) return "0";
  const parts = s.split(".");
  const whole = (parts[0] || "").replace(/\D/g, "") || "0";
  const frac = ((parts[1] || "").replace(/\D/g, "")).padEnd(9, "0").slice(0, 9);
  return whole + frac;
};

<script>
// === TonConnect sendTransaction helper (auto-init, safe) ===
async function __getTonUI(){
  if(window.__tonUI) return window.__tonUI;

  const start = Date.now();
  while(true){
    const has =
      (typeof TonConnectUI !== "undefined") ||
      (window.TonConnectUI) ||
      (window.TON_CONNECT_UI) ||
      (window.TonConnectUI && window.TonConnectUI.TonConnectUI) ||
      (window.TON_CONNECT_UI && (window.TON_CONNECT_UI.TonConnectUI || window.TON_CONNECT_UI.default));
    if(has) break;
    if(Date.now() - start > 12000) throw new Error("TonConnect UI library not found");
    await new Promise(r=>setTimeout(r,50));
  }

  const TonUI =
    (typeof TonConnectUI !== "undefined" ? TonConnectUI : null) ||
    (window.TonConnectUI && (window.TonConnectUI.TonConnectUI || window.TonConnectUI)) ||
    (window.TON_CONNECT_UI && (window.TON_CONNECT_UI.TonConnectUI || window.TON_CONNECT_UI.default || window.TON_CONNECT_UI));

  if(!TonUI) throw new Error("TonConnect UI constructor not found");

  const manifestUrl = location.origin + "/tonconnect-manifest.json";
  window.__DBG_ADD && window.__DBG_ADD("info", "init TonConnectUI manifest=" + manifestUrl);

  window.__tonUI = new TonUI({ manifestUrl });

  try{
    window.__tonUI.onStatusChange((wallet)=>{
      const raw = wallet?.account?.address || "";
      window.__DBG_ADD && window.__DBG_ADD("info", "statusChange wallet=" + (raw || "null"));
      if(raw) localStorage.setItem("bt_wallet", raw);
      else localStorage.removeItem("bt_wallet");
    });
  }catch(_){
    // ignore
  }

  return window.__tonUI;
}

function __isConnected(ui){
  try{
    if(ui && ui.wallet) return true;
    if(ui && ui.account) return true;
  }catch(_){}
  return false;
}

window.sendTonTransaction = async function(...args){
  // supports: sendTonTransaction(to, amountNano, payload) OR sendTonTransaction({to, amountNano, payload, validUntilSec})
  const arg0 = args[0];
  const norm = (args.length === 1 && arg0 && typeof arg0 === "object")
    ? arg0
    : { to: args[0], amountNano: args[1], payload: args[2] };

  const toAddr = norm.to;
  const amountNanoVal = norm.amountNano;
  const payloadVal = norm.payload;
  const validUntilSec = Number.isFinite(norm.validUntilSec) ? norm.validUntilSec : 300;

  const ui = await __getTonUI();

  // normalize amount to integer nanotons string
  let amtRaw = (amountNanoVal === null || amountNanoVal === undefined) ? "" : String(amountNanoVal).trim();

  // if caller accidentally passed TON like "0.1", convert here
  if(amtRaw.includes(".") || amtRaw.includes(",")){
    if(typeof window.tonToNanoStr === "function"){
      amtRaw = window.tonToNanoStr(amtRaw);
    }
  }

  let amt = amtRaw.replace(/\D/g, "");
  amt = amt.replace(/^0+(?=\d)/, "");

  if(!amt || amt === "0"){
    throw new Error("amountNano is empty (check entered сумма) :: raw=" + amtRaw);
  }

  if(!toAddr){
    throw new Error("to address is empty");
  }

  // connect only if not connected
  if(!__isConnected(ui)){
    await __ensureConnected(ui);
  }

  const now = Math.floor(Date.now() / 1000);
  const tx = {
    validUntil: now + validUntilSec,
    messages: [
      {
        address: String(toAddr),
        amount: String(amt)
      }
    ]
  };
  if(payloadVal) tx.messages[0].payload = payloadVal;

  return await ui.sendTransaction(tx);
};

<script>
// === TonConnect wait for wallet helper ===
function __isConnected(ui){
  try{
    if(ui && ui.wallet) return true;
    if(ui && ui.account) return true;
    if(ui && ui.connected) return true;
  }catch(_){}
  return false;
}

async function __waitForWallet(ui, timeoutMs = 60000){
  if(__isConnected(ui)) return ui.wallet || ui.account;
  return await new Promise((resolve, reject)=>{
    let done = false;
    let unsub = null;
    const timer = setTimeout(()=>{
      if(done) return;
      done = true;
      try{ if(typeof unsub === "function") unsub(); }catch(_){}
      reject(new Error("Wallet connection timeout"));
    }, timeoutMs);

    try{
      unsub = ui.onStatusChange((wallet)=>{
        if(done) return;
        const addr = wallet && wallet.account && wallet.account.address;
        if(addr){
          done = true;
          clearTimeout(timer);
          try{ if(typeof unsub === "function") unsub(); }catch(_){}
          resolve(wallet);
        }
      });
    }catch(e){
      clearTimeout(timer);
      reject(e);
    }
  });
}

async function __ensureConnected(ui, opts = {}) {
  if (!ui) throw new Error("TonConnect UI not ready");

  // 1) Wait for session restore if library supports it (prevents "already connected" during restore)
  try {
    if (ui.connectionRestored && typeof ui.connectionRestored.then === "function") {
      await ui.connectionRestored;
    }
  } catch (e) {
    // ignore
  }

  // 2) If already connected after restore -> done
  if (__isConnected(ui)) return ui.wallet;

  // 3) Global lock to prevent parallel connects
  ui.__btConnecting = ui.__btConnecting || false;
  if (ui.__btConnecting) return null;
  ui.__btConnecting = true;

  try {
    // 4) Try connect
    await ui.connectWallet(opts);
    return ui.wallet;
  } catch (e) {
    // 5) If TonConnect says "already connected", disconnect and retry once
    const msg = String(e && (e.message || e));
    if (msg.includes("wallet already connected") || msg.includes("already connected")) {
      try { await ui.disconnect(); } catch(_) {}
      // after disconnect, wait a tick and retry
      await new Promise(r => setTimeout(r, 150));
      await ui.connectWallet(opts);
      return ui.wallet;
    }
    throw e;
  } finally {
    ui.__btConnecting = false;
  }
}
</script>

        setTimeout(()=>els.input.focus(), 50);
      }

      els.ok.textContent = okText;
      els.cancel.textContent = cancelText;
      els.cancel.style.display = showCancel ? "block" : "none";

      els.backdrop.style.display = "flex";
      els.backdrop.setAttribute("aria-hidden", "false");

      const cleanup = (res)=>{
        els.backdrop.style.display = "none";
        els.backdrop.setAttribute("aria-hidden", "true");
        els.ok.onclick = null;
        els.cancel.onclick = null;
        window.removeEventListener("keydown", onKey);
        resolve(res);
      };

      const onKey = (e)=>{
        if(e.key === "Escape") cleanup(null);
        if(e.key === "Enter") cleanup(withInput ? (els.input.value || "") : true);
      };
      window.addEventListener("keydown", onKey);

      els.ok.onclick = ()=> cleanup(withInput ? (els.input.value || "") : true);
      els.cancel.onclick = ()=> cleanup(null);
    });
  }

  async function alert(text, title="Сообщение"){
    // Telegram popup if available, else custom modal
    if(window.Telegram?.WebApp?.showPopup){
      return new Promise((resolve)=>{
        Telegram.WebApp.showPopup({ title, message: String(text || ""), buttons: [{id:"ok", type:"ok"}] }, ()=>resolve());
      });
    }
    await show({ title, text: String(text||""), showCancel:false, okText:"Ок" });
  }

  async function confirm(text, title="Подтвердите"){
    if(window.Telegram?.WebApp?.showPopup){
      return new Promise((resolve)=>{
        Telegram.WebApp.showPopup({
          title,
          message: String(text || ""),
          buttons: [
            {id:"cancel", type:"cancel"},
            {id:"ok", type:"ok"}
          ]
        }, (id)=>resolve(id === "ok"));
      });
    }
    const res = await show({ title, text: String(text||""), showCancel:true, okText:"Ок", cancelText:"Отмена" });
    return !!res;
  }

  async function prompt(text, defaultValue="", title="Введите значение", placeholder=""){
    // Telegram doesn't have input popup; use custom modal always
    const res = await show({
      title,
      text: String(text||""),
      withInput:true,
      value: String(defaultValue||""),
      placeholder: placeholder || "",
      okText:"Готово",
      cancelText:"Отмена",
      showCancel:true
    });
    if(res === null) return null;
    return String(res).trim();
  }

  return { alert, confirm, prompt };
})();

/* =============================
   Deterministic shared chart
   + smooth continuity between rounds
   + auto history (last 10 rounds) for new users
   Requires /api/round to return `seeds` array (last 11 round seeds including current).
   ============================= */

// ===== Deterministic PRNG =====
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a |= 0;
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function randnFrom(rng){
  let u = 0, v = 0;
  while(u === 0) u = rng();
  while(v === 0) v = rng();
  return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

// server time helper
function serverNow(){
  return Date.now() + (STATE._serverOffsetMs || 0);
}

// ===== Elements from your UI =====
const canvas = document.getElementById('candleCanvas');
const ctx = canvas.getContext('2d');
const countdownEl = document.getElementById('countdown');
const historyEl = document.getElementById('roundHistory');

// ===== State =====
const STATE = {
  // view
  view: { visible: 90, offset: 0 },
  _gesture: { pointers: new Map(), mode: null, startDist: 0, startVisible: 90, lastX: 0 },

  // rounds
  historyMax: 10,
  rounds: [],              // finished rounds [{roundId, dir, candles}]
  currentRoundId: null,
  currentSeed: 0,
  currentStartMs: null,
  currentPhase: "RUN",

  // render
  renderCandles: [],
  renderBoundaries: [],

  // params (server-controlled)
  runDurationMs: 30000,
  tickMs: 500,
  betCountdownSec: 7,
  volatility: 0.85,

  // current
  currentCandles: [],
  currentPrice: 100,
  currentBasePrice: 100,
  currentTickIndex: 0,
  currentRng: null,

  // betting (kept from your original)
  balance: 0.00,
  portfolio: 0.00,
  betAmount: 1.00,
  pendingBet: null,
  activeBet: null,
  insuranceOn: false,

  // server sync
  _serverOffsetMs: 0,
  _roundStartMs: null,

  // seeds cache from server
  seeds: [] // [{roundId, seed}]
};

// ===== Betting UI hookups (kept compatible with your layout) =====
function updateBalance(){
  const el = document.getElementById('balance');
  if(el) el.textContent = STATE.balance.toFixed(2);
  const p = document.getElementById('portfolio');
  if(p) p.textContent = (STATE.portfolio || 0).toFixed(2);
}
updateBalance();

function clampAmount(v){
  v = Math.max(0.1, Math.min(9999, Number(v)));
  return Math.round(v * 100) / 100;
}
function setAmount(v){
  const val = clampAmount(v);
  STATE.betAmount = val;
  document.querySelectorAll('.amt').forEach(b=>{
    const a = Number(b.getAttribute('data-amt'));
    b.classList.toggle('is-active', Math.abs(a - val) < 0.0001);
  });
}
function placeBet(side){
  // у тебя ставки обычно в фазу ставок — оставим как было: ставить можно в COUNTDOWN
  if(STATE.currentPhase !== "COUNTDOWN") return;
  const amt = clampAmount(STATE.betAmount || 0.1);
  if(STATE.balance < amt) return;
  STATE.pendingBet = { side, amount: amt };
}
function applyPendingBetAtRoundStart(){
  if(!STATE.pendingBet) return;
  const { side, amount } = STATE.pendingBet;
  if(STATE.balance < amount){ STATE.pendingBet = null; return; }
  STATE.balance = Math.max(0, STATE.balance - amount);
  updateBalance();
  STATE.activeBet = { side, amount, entry: STATE.currentBasePrice, insurance: STATE.insuranceOn };
  STATE.pendingBet = null;
}
function resolveActiveBet(){
  if(!STATE.activeBet) return;
  const end = STATE.currentPrice;
  const entry = STATE.activeBet.entry;
  const amt = STATE.activeBet.amount;
  const side = STATE.activeBet.side;

  let win = false;
  if(side === "LONG" && end > entry) win = true;
  if(side === "SHORT" && end < entry) win = true;

  // demo: portfolio = payout, then user can cashout
  STATE.portfolio = win ? (amt * 2) : 0;
  updateBalance();
  STATE.activeBet = null;
}

// ===== Candle generator =====
function makeNextCandle(prev, rng){
  const open = prev;
  const drift = randnFrom(rng) * STATE.volatility;
  const close = open + drift;

  const body = Math.max(0.10, Math.abs(close - open));
  const longWick = rng() < 0.18;
  const wickMult = longWick ? (1.4 + rng()*0.9) : (0.35 + rng()*0.65);
  const cap = STATE.volatility * 2.2 + 0.8;
  const upWick = Math.min(cap, body * wickMult * (0.7 + rng()*0.8));
  const dnWick = Math.min(cap, body * wickMult * (0.7 + rng()*0.8));

  return {
    open,
    close,
    high: Math.max(open,close) + upWick,
    low:  Math.min(open,close) - dnWick
  };
}
function fullRunTicks(){
  return Math.floor(STATE.runDurationMs / STATE.tickMs);
}

// ===== History UI (your chips) =====
function renderHistory(){
  if(!historyEl) return;
  historyEl.innerHTML = "";
  const last = STATE.rounds.slice(-STATE.historyMax);
  for(const item of last){
    const d = document.createElement('div');
    d.className = "hist-chip " + (item.dir === "UP" ? "up" : "down");
    const tri = document.createElement('div');
    tri.className = "tri";
    tri.textContent = item.dir === "UP" ? "▲" : "▼";
    d.appendChild(tri);
    historyEl.appendChild(d);
  }
}

// ===== Build continuous rounds from seeds (NO JUMPS) =====
function getSeed(roundId){
  const found = STATE.seeds.find(x => x.roundId === roundId);
  return found ? (found.seed >>> 0) : null;
}
function baseFromSeed(seed){
  // just to anchor the window; continuity is created by chaining
  return 100 + (seed % 100) / 10;
}
function buildRoundCandles(seed, startPrice){
  const rng = mulberry32(seed >>> 0);
  const ticks = fullRunTicks();
  const out = [];
  let p = startPrice;
  for(let i=0;i<ticks;i++){
    const c = makeNextCandle(p, rng);
    out.push(c);
    p = c.close;
  }
  return { candles: out, endPrice: p };
}
function buildLastRounds(roundId){
  // We build last 10 finished rounds + prepare base for current round
  const fromId = roundId - STATE.historyMax;
  const seeds = [];
  for(let i=fromId;i<=roundId;i++){
    const s = getSeed(i);
    if(s == null) return null;
    seeds.push({ roundId: i, seed: s });
  }

  // anchor base for the first round in window
  let base = baseFromSeed(seeds[0].seed);

  const finished = [];
  for(let i=0;i<STATE.historyMax;i++){
    const { roundId: rid, seed } = seeds[i];
    const built = buildRoundCandles(seed, base);
    const candles = built.candles;
    const start = candles[0].open;
    const end = candles[candles.length - 1].close;
    const dir = end >= start ? "UP" : "DOWN";
    finished.push({ roundId: rid, seed, dir, candles });
    base = built.endPrice; // next round starts exactly at end of previous
  }

  // current base = end of last finished
  const currentBase = base;

  return { finished, currentBase, currentSeed: seeds[seeds.length - 1].seed };
}

// ===== Render series (history + current) =====
function buildRenderSeries(){
  const series = [];
  const bounds = [];
  let idx = 0;

  const rounds = STATE.rounds.slice(-STATE.historyMax);
  for(const r of rounds){
    bounds.push(idx);
    for(const c of r.candles) series.push(c);
    idx = series.length;
  }

  if(STATE.currentCandles.length){
    bounds.push(idx);
    for(const c of STATE.currentCandles) series.push(c);
  }

  STATE.renderCandles = series;
  STATE.renderBoundaries = bounds;
}

// ===== Canvas / draw (kept your visual style: grid + dashed lines + price tag) =====
function resize(){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.getBoundingClientRect();
  canvas.width = Math.floor(r.width * dpr);
  canvas.height = Math.floor(r.height * dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

function roundRect(ctx, x, y, w, h, r, fill, stroke) {
  if (w < 2 * r) r = w / 2;
  if (h < 2 * r) r = h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  if (fill) ctx.fill();
  if (stroke) ctx.stroke();
}

function draw(){
  const rect = canvas.getBoundingClientRect();
  const w = rect.width;
  const h = rect.height;

  ctx.clearRect(0,0,w,h);

  const bg = ctx.createLinearGradient(0,0,0,h);
  bg.addColorStop(0, 'rgba(0,0,0,.35)');
  bg.addColorStop(1, 'rgba(0,0,0,.15)');
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,w,h);

  buildRenderSeries();
  const series = STATE.renderCandles;
  if(!series.length) return;

  // viewport
  const total = series.length;
  const visible = Math.max(20, Math.min(total, Math.floor(STATE.view.visible || 90)));
  const offset = Math.max(0, Math.min(total-1, Math.floor(STATE.view.offset || 0)));
  const endIdx = total - offset;
  const startIdx = Math.max(0, endIdx - visible);
  const candles = series.slice(startIdx, endIdx);
  if(!candles.length) return;

  let minP = Infinity, maxP = -Infinity;
  for(const c of candles){
    minP = Math.min(minP, c.low);
    maxP = Math.max(maxP, c.high);
  }
  const pad = (maxP - minP) * 0.08 + 0.01;
  minP -= pad; maxP += pad;

  const leftPad = 14, rightPad = 74, topPad = 12, botPad = 18;
  const plotW = w - leftPad - rightPad;
  const plotH = h - topPad - botPad;

  function y(p){
    return topPad + (maxP - p) / (maxP - minP) * plotH;
  }

  // grid
  ctx.strokeStyle = 'rgba(255,255,255,.07)';
  ctx.lineWidth = 1;
  for(let i=0;i<=6;i++){
    const yy = topPad + (plotH/6)*i;
    ctx.beginPath();
    ctx.moveTo(leftPad, yy);
    ctx.lineTo(leftPad + plotW, yy);
    ctx.stroke();
  }
  for(let i=0;i<=10;i++){
    const xx = leftPad + (plotW/10)*i;
    ctx.beginPath();
    ctx.moveTo(xx, topPad);
    ctx.lineTo(xx, topPad + plotH);
    ctx.stroke();
  }

  const n = candles.length;
  const spacing = plotW / n;
  const bodyW = Math.max(4, Math.min(18, spacing * 0.80));

  // round separators
  const viewStart = startIdx;
  const viewEnd = endIdx;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.18)';
  ctx.lineWidth = 1;
  ctx.setLineDash([6,6]);
  for(const b of STATE.renderBoundaries){
    if(b <= viewStart || b >= viewEnd) continue;
    const local = b - viewStart;
    const xx = leftPad + spacing*local;
    ctx.beginPath();
    ctx.moveTo(xx, topPad);
    ctx.lineTo(xx, topPad + plotH);
    ctx.stroke();
  }
  ctx.restore();

  // candles
  for(let i=0;i<n;i++){
    const c = candles[i];
    const cx = leftPad + spacing*i + spacing/2;
    const yOpen = y(c.open);
    const yClose = y(c.close);
    const yHigh = y(c.high);
    const yLow  = y(c.low);
    const up = c.close >= c.open;

    // wick
    ctx.strokeStyle = up ? 'rgba(31,207,102,.95)' : 'rgba(217,59,59,.95)';
    ctx.lineWidth = 1.0;
    ctx.beginPath();
    ctx.moveTo(cx, yHigh);
    ctx.lineTo(cx, yLow);
    ctx.stroke();

    // body
    const top = Math.min(yOpen, yClose);
    const bot = Math.max(yOpen, yClose);
    const bodyH = Math.max(2, bot - top);
    ctx.fillStyle = up ? 'rgba(31,207,102,1)' : 'rgba(217,59,59,1)';
    ctx.strokeStyle = 'rgba(0,0,0,.35)';
    ctx.lineWidth = 1;
    roundRect(ctx, cx - bodyW/2, top, bodyW, bodyH, 1.5, true, true);
  }

  // last price (use current last candle)
  const lastCandle = series[series.length - 1];
  if(!lastCandle) return;
  const lastY = y(lastCandle.close);

  ctx.strokeStyle = 'rgba(255,255,255,.22)';
  ctx.setLineDash([6,6]);
  ctx.beginPath();
  ctx.moveTo(leftPad, lastY);
  ctx.lineTo(leftPad + plotW, lastY);
  ctx.stroke();
  ctx.setLineDash([]);

  const label = lastCandle.close.toFixed(2);
  ctx.font = '900 14px system-ui, -apple-system, Segoe UI, Roboto, Arial';
  const tw = ctx.measureText(label).width;
  const tagW = tw + 18;
  const tagH = 30;
  const xTag = leftPad + plotW + 10;
  const yTag = Math.max(topPad, Math.min(topPad + plotH - tagH, lastY - tagH/2));
  const tagUp = lastCandle.close >= lastCandle.open;

  ctx.fillStyle = tagUp ? 'rgba(31,207,102,.92)' : 'rgba(217,59,59,.92)';
  roundRect(ctx, xTag, yTag, tagW, tagH, 10, true, false);
  ctx.fillStyle = 'rgba(0,0,0,.86)';
  ctx.fillText(label, xTag + 9, yTag + 20);
}

// ===== Pan/Zoom (kept) =====
function clampView(){
  if(!STATE.view) STATE.view = { visible: 90, offset: 0 };
  const total = (STATE.renderCandles && STATE.renderCandles.length) ? STATE.renderCandles.length : 0;
  STATE.view.visible = Math.max(20, Math.min(total || 20, Math.floor(STATE.view.visible || 90)));
  const maxOffset = Math.max(0, total - 1);
  STATE.view.offset = Math.max(0, Math.min(maxOffset, Math.floor(STATE.view.offset || 0)));
}
function panByCandles(delta){
  clampView();
  STATE.view.offset = (STATE.view.offset || 0) + delta;
  clampView();
  draw();
}
function zoomTo(visible){
  clampView();
  const prev = STATE.view.visible;
  STATE.view.visible = visible;
  clampView();
  if((STATE.view.offset || 0) !== 0){
    const diff = (STATE.view.visible - prev);
    STATE.view.offset = Math.max(0, (STATE.view.offset || 0) + Math.floor(diff/2));
  }
  clampView();
  draw();
}
function installPanZoom(){
  const el = canvas;
  if(!el) return;
  el.style.touchAction = "none";
  const g = STATE._gesture;

  function getDist(){
    const pts = Array.from(g.pointers.values());
    if(pts.length < 2) return 0;
    const dx = pts[0].x - pts[1].x;
    const dy = pts[0].y - pts[1].y;
    return Math.hypot(dx, dy);
  }

  el.addEventListener('pointerdown', (e)=>{
    el.setPointerCapture(e.pointerId);
    g.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if(g.pointers.size === 1){
      g.mode = "pan";
      g.lastX = e.clientX;
    }else if(g.pointers.size === 2){
      g.mode = "pinch";
      g.startDist = getDist();
      clampView();
      g.startVisible = STATE.view.visible;
    }
  });

  el.addEventListener('pointermove', (e)=>{
    if(!g.pointers.has(e.pointerId)) return;
    g.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if(g.mode === "pinch" && g.pointers.size >= 2){
      const dist = getDist();
      if(dist <= 0 || g.startDist <= 0) return;
      const ratio = g.startDist / dist;
      const target = Math.round(g.startVisible * ratio);
      zoomTo(target);
      return;
    }

    if(g.mode === "pan" && g.pointers.size === 1){
      const dx = e.clientX - g.lastX;
      g.lastX = e.clientX;
      const width = el.getBoundingClientRect().width || 1;
      clampView();
      const candlesPerPx = (STATE.view.visible || 90) / width;
      const deltaCandles = Math.round(dx * candlesPerPx);
      if(deltaCandles !== 0) panByCandles(deltaCandles);
    }
  });

  function endPointer(e){
    if(g.pointers.has(e.pointerId)) g.pointers.delete(e.pointerId);
    if(g.pointers.size === 0){
      g.mode = null;
    }else if(g.pointers.size === 1){
      g.mode = "pan";
      const pt = Array.from(g.pointers.values())[0];
      g.lastX = pt.x;
    }
  }

  el.addEventListener('pointerup', endPointer);
  el.addEventListener('pointercancel', endPointer);

  el.addEventListener('wheel', (e)=>{
    e.preventDefault();
    clampView();
    const step = Math.max(2, Math.round((STATE.view.visible || 90) * 0.08));
    if(e.deltaY < 0) zoomTo((STATE.view.visible || 90) - step);
    else zoomTo((STATE.view.visible || 90) + step);
  }, { passive: false });

  let lastTap = 0;
  el.addEventListener('click', ()=>{
    const now = Date.now();
    if(now - lastTap < 280){
      clampView();
      STATE.view.offset = 0;
      draw();
    }
    lastTap = now;
  });
}

// ===== Sync from server (build history + current with continuity) =====
async function syncFromServer(){
  try{
    const r = await fetch('/api/round', { cache: 'no-store' });
    const data = await r.json();

    // server clock offset
    STATE._serverOffsetMs = (data.serverNow - Date.now());

    // timings
    STATE.runDurationMs = data.runDurationMs;
    STATE.tickMs = data.tickMs;
    STATE.betCountdownSec = data.betCountdownSec;

    // phase + anchor
    STATE.currentPhase = data.phase;
    STATE._roundStartMs = data.roundStartMs;

    // seeds list from server (must include roundId-10 .. roundId)
    STATE.seeds = Array.isArray(data.seeds) ? data.seeds : [];

    const roundId = data.roundId;

    // build last 10 finished rounds and get base for current
    const built = buildLastRounds(roundId);
    if(!built) return;

    STATE.rounds = built.finished;
    STATE.currentRoundId = roundId;
    STATE.currentSeed = built.currentSeed;

    // current base starts where previous ended (NO JUMPS)
    STATE.currentBasePrice = built.currentBase;
    STATE.currentPrice = built.currentBase;

    // rebuild current candles up to now (RUN only; in countdown we keep full run already from history build)
    const elapsed = Math.max(0, data.serverNow - data.roundStartMs);
    const cycleMs = data.runDurationMs + data.betCountdownSec*1000;
    const inCycle = elapsed % cycleMs;
    const inRun = inCycle < data.runDurationMs;
    const targetTicks = inRun ? Math.floor(inCycle / data.tickMs) : fullRunTicks();

    const rng = mulberry32(STATE.currentSeed);
    let p = STATE.currentBasePrice;
    const candles = [];
    for(let i=0;i<targetTicks;i++){
      const c = makeNextCandle(p, rng);
      candles.push(c);
      p = c.close;
    }
    STATE.currentCandles = candles;
    STATE.currentPrice = p;
    STATE.currentTickIndex = targetTicks;
    STATE.currentRng = rng;

    // history chips
    renderHistory();

    // countdown UI
    if(countdownEl){
      if(STATE.currentPhase === "COUNTDOWN"){
        countdownEl.style.display = "flex";
        // compute remain seconds
        const remainMs = Math.max(0, cycleMs - inCycle);
        countdownEl.textContent = String(Math.max(0, Math.ceil(remainMs/1000)));
      }else{
        countdownEl.style.display = "none";
      }
    }

    draw();
  }catch(e){
    console.warn("syncFromServer failed:", e);
  }
}

// ===== Tick (smooth countdown + bet settle + start bet at new round) =====
function tick(){
  if(STATE._roundStartMs == null) return;

  const now = serverNow();
  const elapsed = Math.max(0, now - STATE._roundStartMs);
  const cycleMs = STATE.runDurationMs + STATE.betCountdownSec*1000;
  const inCycle = elapsed % cycleMs;

  if(inCycle < STATE.runDurationMs){
    // RUN
    if(STATE.currentPhase !== "RUN"){
      STATE.currentPhase = "RUN";
      if(countdownEl) countdownEl.style.display = "none";
      applyPendingBetAtRoundStart();
    }
    // during RUN we don't incrementally generate here (syncFromServer rebuilds),
    // but we can light draw for smoothness:
    draw();
  }else{
    // COUNTDOWN
    if(STATE.currentPhase !== "COUNTDOWN"){
      STATE.currentPhase = "COUNTDOWN";
      // settle bet using current end price (currentPrice)
      resolveActiveBet();
    }
    const remainMs = Math.max(0, cycleMs - inCycle);
    const remainSec = Math.max(0, Math.ceil(remainMs/1000));
    if(countdownEl){
      countdownEl.style.display = "flex";
      countdownEl.textContent = String(remainSec);
    }
    draw();
  }
}

// ===== Wire your buttons =====
function wireAmountButtons(){
  document.querySelectorAll('.amt').forEach(btn=>{
    btn.addEventListener('click', () => setAmount(btn.getAttribute('data-amt')));
  });
  setAmount(1.00);
}
window.addEventListener('resize', () => { resize(); draw(); });

// expose handlers expected by HTML
window.onUp = () => placeBet("LONG");
window.onDown = () => placeBet("SHORT");
window.cancelBet = () => { STATE.pendingBet = null; };

  STATE.portfolio = Math.round((v - half) * 100) / 100;
  updateBalance();
};

};

function shortAddr(a){
  if(!a) return "";
  return a.slice(0,6) + "…" + a.slice(-6);
}

function setWalletUI(addr){
  const btn = document.getElementById("connectWalletBtn");
  const disBtn = document.getElementById("disconnectBtn");
  if(btn) btn.textContent = addr ? ("Кошелек: " + shortAddr(addr)) : "Привязать кошелек";

let __disconnecting = false;
async function disconnectTonWallet(){
  if(__disconnecting) return;
  __disconnecting = true;
  try{
    // TonConnect disconnect (if available)
    try{
      if(window.__tonUI && typeof window.__tonUI.disconnect === "function"){
        await window.__tonUI.disconnect();
      }
    }catch(e){}

    // clear local state
    try{ localStorage.removeItem(WALLET_KEY); }catch(e){}
    try{ setWalletUI(""); }catch(e){}

    // IMPORTANT: do NOT call /api/me on disconnect (backend requires address)
    await fetchServerBalance();
  } finally {
    __disconnecting = false;
  }
}
async function fetchServerBalance(){
  try{
    const addr = localStorage.getItem(WALLET_KEY);
    if(!addr) return;
    const r = await fetch(`/api/me?address=${encodeURIComponent(addr)}`, { cache: "no-store" });
    if(!r.ok) return;
    const data = await r.json();
    const nano = BigInt(String(data.balanceNano || "0"));
    const ton = Number(nano) / 1e9;
    if(Number.isFinite(ton)){
      STATE.balance = ton;
      updateBalance();
    }
  }catch(e){
    console.warn("fetchServerBalance failed", e);
  }
}


async function waitTonConnectUI(timeoutMs = 12000){
  // ждём появления TonConnect UI в любом из возможных глобальных имён
  const start = Date.now();
  while(true){
    const hasGlobal =
      (typeof TonConnectUI !== "undefined") ||
      (typeof window !== "undefined" && (
        window.TonConnectUI ||
        (window.TonConnectUI && window.TonConnectUI.TonConnectUI) ||
        (window.tonconnect && window.tonconnect.ui) ||
        window.TON_CONNECT_UI ||
        (window.TON_CONNECT_UI && (window.TON_CONNECT_UI.TonConnectUI || window.TON_CONNECT_UI.default))
      ));
if(hasGlobal) return true;
    if(Date.now() - start > timeoutMs) return false;
    await new Promise(r => setTimeout(r, 50));
  }
}

async function startDeposit(){
  const addr = localStorage.getItem(WALLET_KEY);
  if(!addr){ await UI.alert("Сначала привяжи кошелек."); return; }

  const amtStr = await UI.prompt("Сколько TON пополнить? (например 0.5)", "0.1", "Депозит", "Например 0.5");
  if(!amtStr) return;

  const amountTon = Number(String(amtStr).replace(",", "."));
  if(!Number.isFinite(amountTon) || amountTon <= 0){ await UI.alert("Неверная сумма"); return; }

  // создаём депозит на сервере (если есть бэкенд) — чтобы получить комментарий/пейлоад для идентификации
  let payTo = "";
  let payload = "";
  let amountNano = window.tonToNanoStr(amountTon);
  try{
    const r = await fetch("/api/deposit/create", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ address: addr, amountTon })
    });

    const ct = (r.headers.get("content-type") || "").toLowerCase();
    if(ct.includes("application/json")){
      const data = await r.json();
      payTo = (data.toAddress || data.payTo || "").trim();
      payload = (data.payload || data.payloadBase64 || "").trim();
      if(data.amountNano) amountNano = String(data.amountNano);
    }else{
      // если сервер вернул просто текст — покажем его после оплаты
      const t = await r.text();
      if(!r.ok){ await UI.alert("Ошибка депозита: " + t); return; }
    }
  }catch(e){
    // сервер может быть недоступен — тогда просто отправим на DEPOSIT_RECEIVER
  }

  if(!payTo) payTo = DEPOSIT_RECEIVER;

  if(!payTo || payTo === "YOUR_TON_DEPOSIT_ADDRESS_HERE"){
    await UI.alert("Не задан адрес для депозита. Укажи DEPOSIT_RECEIVER в коде или пусть /api/deposit/create возвращает toAddress.", "Депозит");
    return;
  }
  if(!amountNano){
    await UI.alert("Не удалось посчитать сумму в nanoTON.", "Депозит");
    return;
  }

  // Открываем кошелёк и предлагаем оплатить
  const ok = await window.sendTonTransaction(payTo, amountNano, payload);
  if(ok){
    await UI.alert("Запрос на оплату отправлен в кошелёк. После подтверждения баланс обновится автоматически.", "Депозит");
    // попробуем обновить баланс через сервер
    await fetchServerBalance();
  }
}


async function requestWithdraw(){
  const addr = localStorage.getItem(WALLET_KEY);
  if(!addr){ UI.alert("Сначала привяжи кошелек."); return; }

  const amtStr = await UI.prompt("Сколько TON вывести?", "0.1", "Вывод", "Например 0.1");
  if(!amtStr) return;
  const amountTon = Number(amtStr.replace(",", "."));
  if(!Number.isFinite(amountTon) || amountTon <= 0){ UI.alert("Неверная сумма"); return; }

  const toAddr = await UI.prompt("Куда вывести? (TON адрес)", addr, "Адрес вывода", "TON адрес");
  if(!toAddr) return;

  const r = await fetch("/api/withdraw/request", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ fromAddress: addr, toAddress: toAddr.trim(), amountTon })
  });
  const msg = await r.text();
  if(!r.ok){ await UI.alert("Ошибка вывода: " + msg); return; }

  // сразу обновим баланс из сервера
  await fetchServerBalance();
  await UI.alert(msg, "Вывод");
}

<script>
// ================= SAFE TONCONNECT PATCH =================
let __tc_connecting = false;

function __connected(ui) {
  return !!(ui && (ui.connected || ui.wallet));
}

async function safeConnectTon(ui, opts = {}) {
  if (!ui) throw new Error("TonConnect UI not ready");
  if (__connected(ui)) return ui.wallet;
  if (__tc_connecting) return null;

  __tc_connecting = true;
  try {
    await ui.connectWallet(opts);
    return ui.wallet;
  } finally {
    __tc_connecting = false;
  }
}

async function toggleTonWallet(opts = {}) {
  await waitTonConnectUI();
  const ui = await __getTonUI();

  if (__connected(ui)) {
    try { await ui.disconnect(); } catch(e){}
    localStorage.removeItem(WALLET_KEY);
    setWalletUI("");
    return;
  }

  await safeConnectTon(ui, opts);
  const addr = ui?.wallet?.account?.address || "";
  if (addr) {
    localStorage.setItem(WALLET_KEY, addr);
    onWalletConnected(addr);
    onWalletConnected(addr);
    setWalletUI(addr);
}
}
// ================= END SAFE TONCONNECT PATCH =================
</script>
<script>
// ================= TONCONNECT OVERRIDES (FIX DOUBLE CONNECT) =================
(function(){
  // hard override connection checks used by older code paths
  window.__tc_connecting2 = window.__tc_connecting2 || false;

  window.__isConnected = function(ui){
    try { return !!(ui && (ui.connected || ui.wallet)); } catch(e){ return false; }
  };

  window.__ensureConnected = async function(ui, opts = {}){
    if (!ui) throw new Error("TonConnect UI not ready");
    if (window.__isConnected(ui)) return ui.wallet;
    if (window.__tc_connecting2) return null;
    window.__tc_connecting2 = true;
    try{
      // call TonConnect UI connect
      await ui.connectWallet(opts);
      return ui.wallet;
    } finally {
      window.__tc_connecting2 = false;
    }
  };

  // override connectTonWallet to go through __ensureConnected
  window.connectTonWallet = async function(opts = {}){
    await waitTonConnectUI();
    const ui = await __getTonUI();
    await window.__ensureConnected(ui, opts);
    const addr = ui?.wallet?.account?.address || ui?.account?.address || "";
    if (addr) {
      try { localStorage.setItem(WALLET_KEY, addr); } catch(e){}
      try { onWalletConnected(addr);
    onWalletConnected(addr);
    setWalletUI(addr);
} catch(e){}
    }
  };
})();
// ================= END TONCONNECT OVERRIDES =================
</script>

<script>
// ================= GLOBAL TONCONNECT NO-DOUBLE-CONNECT PATCH =================
(function(){
  function __patchTonUI(ui){
    if(!ui || ui.__btPatched) return ui;
    ui.__btPatched = true;

    const origConnectWallet = typeof ui.connectWallet === "function" ? ui.connectWallet.bind(ui) : null;

    if(origConnectWallet){
      ui.connectWallet = async function(opts){
        // Wait for session restore if supported (prevents race)
        try{
          if(this.connectionRestored && typeof this.connectionRestored.then === "function"){
            await this.connectionRestored;
          }
        }catch(e){}

        // If already connected -> NO-OP (return current wallet)
        try{
          if(this.connected || this.wallet){
            return this.wallet;
          }
        }catch(e){}

        // Otherwise do real connect
        try{
          return await origConnectWallet(opts);
        }catch(e){
          const msg = String(e && (e.message || e));
          if(msg.includes("wallet already connected") || msg.includes("already connected")){
            // Treat as success
            return this.wallet;
          }
          throw e;
        }
      };
    }

    return ui;
  }

  // Wrap __getTonUI to patch every time an instance is obtained
  const prevGet = window.__getTonUI;
  if(typeof prevGet === "function"){
    window.__getTonUI = async function(){
      const ui = await prevGet.apply(this, arguments);
      return __patchTonUI(ui);
    };
  }

  // Patch existing global instance if present
  try{
    if(window.__tonUI) __patchTonUI(window.__tonUI);
  }catch(e){}

  // Make connect button safe toggle (if button exists)
  try{
    const btn = document.getElementById("connectWalletBtn");
    if(btn){
      btn.onclick = async function(){
        await waitTonConnectUI();
        const ui = await window.__getTonUI();
        __patchTonUI(ui);

        // Wait restore
        try{ if(ui.connectionRestored) await ui.connectionRestored; }catch(e){}

        if(ui.connected || ui.wallet){
          try{ await ui.disconnect(); }catch(e){}
          try{ localStorage.removeItem(WALLET_KEY); }catch(e){}
          try{ setWalletUI(""); }catch(e){}
          return;
        }

        await ui.connectWallet({});
        const addr = ui?.wallet?.account?.address || "";
        if(addr){
          try{ localStorage.setItem(WALLET_KEY, addr); }catch(e){}
          try{ onWalletConnected(addr);
    onWalletConnected(addr);
    setWalletUI(addr);
}catch(e){}
        }
      };
    }
  }catch(e){}
})();
// ================= END GLOBAL TONCONNECT PATCH =================
</script>


<script>
// ================= TELEGRAM TON WALLET CONNECT PATCH =================
// 1) В Telegram (Mini App / WebView) используем openModal(), а не прямой connectWallet()
// 2) Ждем connectionRestored перед действиями
// 3) Не делаем double-connect
// 4) Ставим twaReturnUrl (лучше заменить на https://t.me/<BOT>/<APP>)

(function(){
  const __isTelegram = () => !!(window.Telegram && window.Telegram.WebApp);
  const __sleep = (ms) => new Promise(r => setTimeout(r, ms));

  async function __waitWallet(ui, timeoutMs = 20000){
    const t0 = Date.now();
    while(Date.now() - t0 < timeoutMs){
      if(ui && (ui.connected || ui.wallet)) return ui.wallet;
      await __sleep(200);
    }
    return null;
  }

  async function __ensureRestored(ui){
    try{
      if(ui && ui.connectionRestored && typeof ui.connectionRestored.then === "function"){
        await ui.connectionRestored;
      }
    }catch(e){}
  }

  function __patchOptions(ui){
    if(!ui || ui.__btTwaPatched) return ui;
    ui.__btTwaPatched = true;

    const fallbackReturnUrl = "https://bulltrade-three.vercel.app/";

    try{
      if(typeof ui.setOptions === "function"){
        ui.setOptions({
          actionsConfiguration: {
            twaReturnUrl: fallbackReturnUrl
          }
        });
      }
    }catch(e){}

    return ui;
  }

  const prevGet = window.__getTonUI;
  if(typeof prevGet === "function"){
    window.__getTonUI = async function(){
      const ui = await prevGet.apply(this, arguments);
      return __patchOptions(ui);
    };
  }

  async function connectTelegramSafe(){
    console.log('TonConnect TG flow: start', {href: window.location.href});
    await waitTonConnectUI();
    const ui = await window.__getTonUI();
    __patchOptions(ui);
    await __ensureRestored(ui);

    if(ui.connected || ui.wallet){
      const addr = ui?.wallet?.account?.address || "";
      if(addr){
        try{ localStorage.setItem(WALLET_KEY, addr); }catch(e){}
        try{ onWalletConnected(addr);
    onWalletConnected(addr);
    setWalletUI(addr);
}catch(e){}
      }
      return;
    }

    try{ await ui.disconnect(); }catch(e){}

    if(typeof ui.openModal === "function"){
      try{
        await ui.openModal();
      }catch(e){
        console.log("TonConnect modal canceled/aborted:", e);
        return;
      }
    }else{
      await ui.connectWallet({});
    }

    await __waitWallet(ui, 20000);

    const addr = ui?.wallet?.account?.address || "";
    if(addr){
      try{ localStorage.setItem(WALLET_KEY, addr); }catch(e){}
      try{ onWalletConnected(addr);
    onWalletConnected(addr);
    setWalletUI(addr);
}catch(e){}
    }
  }

  const prevConnectTonWallet = window.connectTonWallet;
  window.connectTonWallet = async function(opts = {}){
    if(__isTelegram()){
      return connectTelegramSafe();
    }
    if(typeof prevConnectTonWallet === "function"){
      return prevConnectTonWallet(opts);
    }
    await waitTonConnectUI();
    const ui = await window.__getTonUI();
    await __ensureRestored(ui);
    if(ui.connected || ui.wallet) return;
    await ui.connectWallet(opts);
  };

  try{
    const btn = document.getElementById("connectWalletBtn");
    if(btn){
      btn.onclick = () => window.connectTonWallet({});
    }
  }catch(e){}
})();
// ================= END TELEGRAM TON WALLET CONNECT PATCH =================
</script>
