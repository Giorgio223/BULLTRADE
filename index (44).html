<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>BULL TRADE</title>
<style>
body{
  margin:0;
  font-family: system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:#0b0d12;
  color:#fff;
}
.app{max-width:100%;}
canvas{width:100%;height:320px;display:block;}
#countdown{
  position:absolute;
  top:12px;left:12px;
  width:42px;height:42px;
  border-radius:50%;
  background:#ff3b3b;
  display:none;
  align-items:center;
  justify-content:center;
  font-weight:900;
}
</style>
</head>
<body>
<div class="app">
  <div style="position:relative">
    <canvas id="candleCanvas"></canvas>
    <div id="countdown"></div>
  </div>
</div>

<script>
try{
  if(window.Telegram && Telegram.WebApp){
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  }
}catch(e){}

const canvas = document.getElementById('candleCanvas');
const ctx = canvas.getContext('2d');
const countdownEl = document.getElementById('countdown');

const STATE = {
  seed:"",
  cycleStartMs:0,
  tickMs:500,
  runDurationMs:30000,
  betCountdownSec:7,
  volatility:0.85,
  startPrice:100,
  candles:[],
  maxCandles:120,
  price:100,
  generatedTick:-1
};

function resize(){
  const dpr = window.devicePixelRatio||1;
  const r = canvas.getBoundingClientRect();
  canvas.width = r.width*dpr;
  canvas.height = r.height*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener('resize',resize);
resize();

function cyrb128(str){
  let h1=1779033703,h2=3144134277,h3=1013904242,h4=2773480762;
  for(let i=0;i<str.length;i++){
    const k=str.charCodeAt(i);
    h1=h2^Math.imul(h1^k,597399067);
    h2=h3^Math.imul(h2^k,2869860233);
    h3=h4^Math.imul(h3^k,951274213);
    h4=h1^Math.imul(h4^k,2716044179);
  }
  return [(h1^h2^h3^h4)>>>0];
}
function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;}}
function rngForTick(t){return mulberry32(cyrb128(STATE.seed+":"+t)[0]);}
function randn(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}

function makeNextCandle(prev,t){
  const r=rngForTick(t);
  const open=prev;
  const close=open+randn(r)*STATE.volatility;
  const hi=Math.max(open,close)+Math.abs(randn(r));
  const lo=Math.min(open,close)-Math.abs(randn(r));
  return{open,close,high:hi,low:lo};
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!STATE.candles.length) return;
  const w=canvas.width,h=canvas.height;
  let min=Infinity,max=-Infinity;
  for(const c of STATE.candles){min=Math.min(min,c.low);max=Math.max(max,c.high);}
  const pad=(max-min)*0.1;
  min-=pad;max+=pad;
  const n=STATE.candles.length;
  const cw=w/n;
  for(let i=0;i<n;i++){
    const c=STATE.candles[i];
    const x=i*cw+cw/2;
    const y=v=>h-(v-min)/(max-min)*h;
    ctx.strokeStyle=c.close>=c.open?"#1fcf66":"#d93b3b";
    ctx.beginPath();
    ctx.moveTo(x,y(c.high));ctx.lineTo(x,y(c.low));ctx.stroke();
    ctx.fillStyle=ctx.strokeStyle;
    ctx.fillRect(x-cw*0.3,y(Math.max(c.open,c.close)),cw*0.6,Math.max(2,Math.abs(y(c.open)-y(c.close))));
  }
}

function generate(){
  const now=Date.now();
  const t=now-STATE.cycleStartMs;
  if(t<STATE.runDurationMs){
    const idx=Math.floor(t/STATE.tickMs);
    while(STATE.generatedTick<idx){
      const nt=STATE.generatedTick+1;
      const c=makeNextCandle(STATE.price,nt);
      STATE.candles.push(c);
      STATE.price=c.close;
      STATE.generatedTick=nt;
      if(STATE.candles.length>STATE.maxCandles) STATE.candles.shift();
    }
  }
}

async function fetchState(){
  const r=await fetch("/api/state",{cache:"no-store"});
  const s=await r.json();
  STATE.seed=s.seed;
  STATE.cycleStartMs=s.cycleStartMs;
  STATE.tickMs=s.tickMs;
  STATE.runDurationMs=s.runDurationMs;
  STATE.betCountdownSec=s.betCountdownSec;
  STATE.volatility=s.volatility;
  STATE.startPrice=s.startPrice;
  STATE.price=s.startPrice;
  STATE.candles=[];
  STATE.generatedTick=-1;
}

(async function(){
  await fetchState();
  setInterval(()=>{
    generate();
    draw();
  },200);
})();
</script>
</body>
</html>
